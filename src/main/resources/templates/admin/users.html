<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Users</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fffdf7;
            color: #303030;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #00277c;
            padding: 20px 7%;
            border-bottom: 1px solid #eadfba;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 27px;
            font-weight: bold;
            color: #ffffff;
            margin: 0;
        }

        nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        nav a {
            text-decoration: none;
            background: #058ef1;
            color: #ffffff;
            padding: 10px 15px;
            border-radius: 5px;
            font-weight: 600;
            transition: 0.2s;
        }

        nav a:hover {
            background: #fb0202;
        }

        footer {
            background: #0a389c;
            border-top: 1px solid #eadfba;
            padding: 23px;
            text-align: center;
            margin-top: 55px;
            color: #ffffff;
        }

        .button,
        .btn {
            display: inline-block;
            background: #7d9ff3;
            color: #302b1b;
            padding: 13px 23px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .button:hover,
        .btn:hover {
            background: #f37f7f;
        }

        main {
            flex: 1;
            width: 100%;
        }

        main a {
            color: #0a389c;
        }

        main a.button,
        main a.btn {
            color: #302b1b;
        }

        main h1,
        main h2,
        main h3 {
            color: #00277c;
        }

        .error,
        .err {
            color: #fb0202;
        }

        .message,
        .msg {
            color: #0a389c;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #0a389c;
            color: #ffffff;
            text-align: left;
            padding: 10px;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #d6e0fa;
        }

        .container {
            max-width: 1100px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .container.narrow {
            max-width: 520px;
        }

        .panel {
            background: white;
            border: 1px solid #7d9ff3;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .panel h1,
        .panel h2 {
            margin-top: 0;
        }

        .table-wrap {
            background: white;
            border: 1px solid #7d9ff3;
            border-radius: 10px;
            padding: 10px;
            overflow-x: auto;
        }

    </style>
</head>
<body>
<header>
    <div class="header-content">

        <h1 class="logo">RockyToys 🧸</h1>

        <nav>
            <a th:href="@{/}">Home</a>
            <a th:href="@{/toys}">Shop Toys</a>
            <a th:href="@{/cart}">My Cart</a>

            <a th:href="@{/users/profile}"
               th:if="${session.loggedInUser != null}">
                My Profile
            </a>

            <a th:href="@{/users/login}"
               th:if="${session.loggedInUser == null}">
                Login
            </a>

            <a th:href="@{/users/register}"
               th:if="${session.loggedInUser == null}">
                Register
            </a>

            <a th:href="@{/users/logout}"
               th:if="${session.loggedInUser != null}">
                Logout
            </a>

            <a th:href="@{/admin/carts}"
               th:if="${session.loggedInUser != null and session.loggedInUser.role == 'ADMIN'}">
                Manage Carts
            </a>
        </nav>

    </div>
</header>
<main class="container">
    <h1>Users</h1>
    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.userId}"></td>
                <td th:text="${u.fullName}"></td>
                <td th:text="${u.email}"></td>
                <td th:text="${u.role}"></td>
                <td><form th:action="@{/users/delete}" method="post" onsubmit="return confirm('Are you sure you want to delete this user?');">
                    <input type="hidden" name="targetUserId" th:value="${u.userId}"/>
                    <button type="submit" class="btn">Delete user</button>
                </form></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>


<footer>
    <p>© 2026 RockyToys. All Rights Reserved.</p>
    <p>Bringing Smiles Through Play! 🧸</p>
</footer>

</body>
</html>
